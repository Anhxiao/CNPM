version: "3.9"

services:

  backend:

    build: ./backend

    container_name: project-management-api

    restart: always

    ports:

      - "5000:5000"

    env_file:

      - ./backend/.env

    volumes:

      - ./backend:/app

      - /app/node_modules

    depends_on:

      - mongodb

  mongodb:

    image: mongo:7

    container_name: mongodb

    restart: always

    ports:

      - "27017:27017"

    volumes:

      - mongodb_data:/data/db

volumes:

  mongodb_data: